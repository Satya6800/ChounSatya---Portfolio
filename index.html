<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/cs.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Choun Satya — Full Stack Developer specializing in Vue.js, Node.js, and modern web applications. Open to new opportunities." />
    <meta property="og:title" content="Choun Satya — Full Stack Developer Portfolio" />
    <meta property="og:description" content="Building modern, scalable web applications with clean UI and powerful backend systems." />
    <meta property="og:type" content="website" />
    <title>Choun Satya - Portfolio</title>
    <!-- Google Fonts: Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,600&display=swap" rel="stylesheet" />
    <!-- Prevent flash of wrong theme (FOUC) -->
    <script>
      (function () {
        var saved = localStorage.getItem('portfolio-theme');
        if (saved) {
          document.documentElement.setAttribute('data-theme', saved);
        } else if (window.matchMedia('(prefers-color-scheme: light)').matches) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
